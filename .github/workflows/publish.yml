name: Publish to PyPI & Update ReadTheDocs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & documentation dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -r requirements.txt

      - name: Sync/Bump version and regenerate Sphinx docs
        id: prep
        run: python deploy/release.py

      - name: Verify Sphinx documentation build
        run: |
          sphinx-build -b html docs docs/_build/html
          rm -rf docs/_build

      - name: Commit updated version & docs and update release tag (triggers ReadTheDocs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml pytenno/__init__.py pytenno/client.py docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.prep.outputs.version }} [skip ci]"
            git push origin HEAD:master
          fi
          git tag -f -a "v${{ steps.prep.outputs.version }}" -m "Release v${{ steps.prep.outputs.version }}"
          git push -f origin "v${{ steps.prep.outputs.version }}"

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
