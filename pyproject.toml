[tool.poetry]
name = "pytenno"
version = "2.0.1"
description = "An asynchronous Python wrapper for the warframe.market v2 API."
authors = ["ShadowMagic896 <peckhamr@outlook.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/statikana/pytenno"
documentation = "https://pytenno.readthedocs.io"
keywords = ["warframe", "warframe.market", "api", "async", "aiohttp", "v2"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
aiohttp = ">=3.8.1"

[tool.poetry.group.dev.dependencies]
black = ">=22.3.0"
isort = ">=5.10.1"
Sphinx = ">=5.1.1"
furo = ">=2022.6.21"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
